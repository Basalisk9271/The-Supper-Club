services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - pantry_data:/data
    environment:
      - PANTRY_DB=/data/pantry.db
      - CORS_ORIGINS=http://localhost:5173
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pantry_data:
